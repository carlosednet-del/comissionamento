name: Deploy main (producao)

# Dispara em push/merge na main. Tambem da pra rodar manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate de aprovacao manual: o job so executa apos aprovacao no
    # GitHub Environment "production" (revisor obrigatorio configurado).
    environment: production
    steps:
      - name: Deploy via SSH (producao)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          username: ${{ secrets.PROD_DEPLOY_USER }}
          key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          port: ${{ secrets.PROD_DEPLOY_PORT || '22' }}
          command_timeout: 20m
          script_stop: true
          script: |
            set -e
            export APP_DIR=/var/www/comissionamento
            export APP_NAME=comissionamento
            export PORT=3001
            cd "$APP_DIR"
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            bash deploy/deploy-main.sh
